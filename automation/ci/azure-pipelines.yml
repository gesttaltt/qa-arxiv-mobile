trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - '**/*.md'
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

stages:
  - stage: Linting
    displayName: 'Code Quality & Linting'
    jobs:
      - job: LintingJob
        displayName: 'Linting and Code Quality'
        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true
            displayName: 'Set up Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -r automation/requirements.txt
            displayName: 'Install dependencies'

          - script: npm install -g markdownlint-cli2
            displayName: 'Install markdownlint-cli2'

          - script: black --check --diff automation/
            displayName: 'Python formatting (Black)'
            continueOnError: true

          - script: ruff check automation/ --output-format=junit --output-file=ruff-results.xml
            displayName: 'Python linting (Ruff)'
            continueOnError: true

          - script: mypy automation/ --junit-xml=mypy-results.xml
            displayName: 'Python type checking (MyPy)'
            continueOnError: false

          - script: yamllint automation/ci/ -f parsable > yamllint-results.txt || true
            displayName: 'YAML linting'
            continueOnError: true

          - script: markdownlint-cli2 "**/*.md" "!node_modules" || true
            displayName: 'Markdown linting'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '*-results.xml'
              failTaskOnFailedTests: false
              testRunTitle: 'Linting Results'
            displayName: 'Publish linting results'
            condition: always()

  - stage: Testing
    displayName: 'QA Testing & Validation'
    dependsOn: Linting
    condition: always()
    jobs:
      - job: UnitTests
        displayName: 'Unit Tests (utils.py — 100% coverage gate)'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r automation/requirements.txt
            displayName: 'Install dependencies'

          - script: |
              mkdir -p test-results
              pytest automation/tests/test_utils.py \
                --cov=automation \
                --cov-report=xml \
                --cov-fail-under=100 \
                --junitxml=test-results/unit-results.xml \
                -v
            displayName: 'Run unit tests'
            continueOnError: false

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/unit-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Unit Tests'
            condition: always()

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: 'coverage.xml'
            displayName: 'Publish code coverage'
            condition: always()

      - job: IntegrationTests
        displayName: 'Integration Tests (arXiv API — continue on error)'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r automation/requirements.txt
            displayName: 'Install dependencies'

          - script: |
              mkdir -p test-results
              pytest automation/tests/ \
                -m "not appium and not slow" \
                --ignore=automation/tests/test_utils.py \
                --html=test-results/integration-report.html \
                --self-contained-html \
                --junitxml=test-results/integration-results.xml \
                --reruns 2 --reruns-delay 60 \
                -v
            displayName: 'Run integration tests'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/integration-results.xml'
              failTaskOnFailedTests: false
              testRunTitle: 'Integration Tests (arXiv API)'
            condition: always()

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'test-results'
              artifactName: 'Integration Test Report'
            displayName: 'Publish HTML report'
            condition: always()

  - stage: AppiumSmoke
    displayName: 'Appium Mobile Smoke Tests'
    dependsOn: Testing
    condition: succeeded()
    jobs:
      # NOT YET VERIFIED — no Azure DevOps project is connected to this repo, so this job has
      # never had a real pipeline run observed, unlike ci.yml's equivalent (GitHub Actions,
      # confirmed passing 2026-07-29, see docs/QA_AUDIT.md §3.7). It mirrors ci.yml's local
      # Android emulator approach as closely as ADO YAML allows, reusing the same
      # automation/ci/run_appium_emulator.sh script, but it also carries a real, disclosed risk
      # that ci.yml's approach didn't: Microsoft-hosted Ubuntu agents' KVM/nested-virtualization
      # support is not guaranteed the way GitHub-hosted runners' is, and without it the emulator
      # either fails to boot or runs too slowly to be useful. Following this project's own rule
      # (§3.7, §2): do not treat this job as passing, or even as bootable, until a real ADO run
      # has been observed — check the actual pipeline run, not this comment.
      - job: AppiumLocalEmulator
        displayName: 'Appium Android Smoke Tests — Local Emulator (unverified, see comment above)'
        timeoutInMinutes: 20
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r automation/requirements.txt
            displayName: 'Install Python dependencies'

          - script: |
              npm install -g appium
              appium driver install uiautomator2
            displayName: 'Install Appium server + UiAutomator2 driver'

          - script: |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null <<'EOF'
              KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
              EOF
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            displayName: 'Enable KVM group perms'

          - script: |
              set -euo pipefail
              export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
              SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
              yes | "$SDKMANAGER" --licenses > /dev/null
              "$SDKMANAGER" --install platform-tools emulator \
                "system-images;android-30;google_apis;x86" > /dev/null
              AVDMANAGER="$(find "$ANDROID_HOME" -name avdmanager -type f | head -1)"
              echo "no" | "$AVDMANAGER" create avd --name test --device pixel \
                --package "system-images;android-30;google_apis;x86" --force
            displayName: 'Install Android emulator + create AVD (API 30, x86)'

          - script: |
              set -euo pipefail
              export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
              "$ANDROID_HOME/emulator/emulator" -avd test -no-window \
                -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none \
                -no-snapshot-save &
              echo $! > emulator.pid
              "$ANDROID_HOME/platform-tools/adb" wait-for-device
              booted=""
              for _ in $(seq 1 60); do
                status="$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
                if [ "$status" = "1" ]; then
                  booted=1
                  break
                fi
                sleep 5
              done
              if [ -z "$booted" ]; then
                echo "Emulator did not report sys.boot_completed within 5 minutes" >&2
                exit 1
              fi
            displayName: 'Boot the emulator'

          - script: bash automation/ci/run_appium_emulator.sh
            displayName: 'Run Appium smoke tests'
            env:
              ARXIV_APK_PATH: '$(Build.SourcesDirectory)/automation/appium/arxiv-papers-v1.0.apk'
              APPIUM_SERVER_URL: 'http://127.0.0.1:4723'
              ANDROID_DEVICE_NAME: 'Android Emulator'

          - script: |
              export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
              "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
              [ -f emulator.pid ] && kill "$(cat emulator.pid)" 2>/dev/null
              true
            displayName: 'Terminate emulator'
            condition: always()

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/appium-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Appium Smoke — Local Emulator'
            condition: always()

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'test-results'
              artifactName: 'Appium Smoke Report (Local Emulator)'
            displayName: 'Publish Appium HTML report'
            condition: always()

      # Optional real-device path, same as the local emulator's counterpart in conftest.py's
      # BROWSERSTACK=true toggle. Disabled by default (BrowserStack's free trial expired
      # 2026-07-08, see docs/QA_AUDIT.md §3.7) — only useful again with a paid/renewed account.
      - job: AppiumBrowserStack
        displayName: 'Appium Android Smoke Tests — BrowserStack App Automate (optional)'
        condition: eq(variables['BROWSERSTACK_ENABLED'], 'true')
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r automation/requirements.txt
            displayName: 'Install dependencies'

          - script: |
              mkdir -p test-results
              pytest automation/tests/appium/ \
                -m appium \
                --html=test-results/appium-report.html \
                --self-contained-html \
                --junitxml=test-results/appium-results.xml \
                -v
            displayName: 'Run Appium smoke tests on BrowserStack'
            env:
              BROWSERSTACK: 'true'
              BROWSERSTACK_USERNAME: '$(BROWSERSTACK_USERNAME)'
              BROWSERSTACK_ACCESS_KEY: '$(BROWSERSTACK_ACCESS_KEY)'
              BROWSERSTACK_APP_ID: '$(BROWSERSTACK_APP_ID)'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/appium-results.xml'
              failTaskOnFailedTests: false
              testRunTitle: 'Appium Smoke — BrowserStack'
            condition: always()

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'test-results'
              artifactName: 'Appium Smoke Report (BrowserStack)'
            displayName: 'Publish Appium HTML report'
            condition: always()
